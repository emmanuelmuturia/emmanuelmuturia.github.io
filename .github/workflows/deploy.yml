name: The Emmanuel Muturia™ Website Deployment CI/CD Pipeline

env:
  CI: false
  GITHUB_USERNAME: ${{ github.repository_owner }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  USE_GITHUB_DATA: "true"
  MEDIUM_USERNAME: "emmanuelmuturia"
  YOUTUBE_CHANNEL_ID: "UCg2Ponw8OIvcSXKwR6F5mMw"
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout...
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets...
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --redact --exit-code 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST...
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

      - name: Setup Node.js...
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies...
        run: npm ci

      - name: Audit production dependencies...
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

      - name: Upload dependency audit report...
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore

      - name: Run Snyk dependency scan...
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          args: --file=package.json --package-manager=npm --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk configuration notice...
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured; Snyk scan was skipped."

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout...
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js...
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies...
        run: npm ci

      - name: Run Unit Tests...
        run: npm run test:ci

  build-and-deploy:
    needs: [security, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout...
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js...
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # ❌ Removed npm@latest step to avoid Version Conflict...

      - name: Install and Build...
        run: |
          npm ci
          npm run build

      - name: Deploy...
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          branch: gh-pages
          folder: build
